# Configuración de herramientas. Las dependencias de ejecución viven en
# requirements.txt, que es lo que instala el Dockerfile (mejor cacheado por
# capas y sin duplicar la lista en dos sitios).

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
