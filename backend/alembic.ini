[alembic]
script_location = alembic

# Una carpeta de migraciones por módulo. Cada módulo abre su propia rama
# (branch label) con su propia revisión base, de modo que un módulo se puede
# añadir o retirar sin reescribir el historial de los demás.
# `alembic upgrade heads` (en plural) avanza todas las ramas.
version_locations = %(here)s/app/modules/core/migrations %(here)s/app/modules/terceros/migrations %(here)s/app/modules/presupuestos/migrations %(here)s/app/modules/obras/migrations %(here)s/app/modules/compras/migrations %(here)s/app/modules/facturacion/migrations %(here)s/app/modules/ia/migrations %(here)s/app/modules/campos_libres/migrations %(here)s/app/modules/crm/migrations %(here)s/app/modules/documentos/migrations %(here)s/app/modules/contratos/migrations
version_path_separator = space

prepend_sys_path = .
file_template = %%(year)d%%(month).2d%%(day).2d_%%(hour).2d%%(minute).2d_%%(slug)s

# La URL real la inyecta env.py desde la configuración de la aplicación.
sqlalchemy.url =

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
