server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;

    # Una SPA: cualquier ruta que no sea un fichero devuelve el index y el
    # enrutador del navegador se encarga. Sin esto, recargar en /obras da 404.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # nginx no trae el tipo de `.webmanifest` en su tabla, y lo serviría como
    # `application/octet-stream`. Algunos navegadores lo rechazan con ese
    # tipo y entonces la aplicación no se puede instalar.
    types {
        application/manifest+json  webmanifest;
    }

    # Los ficheros con hash en el nombre no cambian nunca de contenido, así
    # que se pueden guardar para siempre.
    #
    # Solo `add_header`, sin `expires`: las dos juntas mandan DOS cabeceras
    # `Cache-Control` distintas y el navegador se queda con la que quiera.
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable" always;
    }

    # El service worker NO se cachea. Si el navegador se quedara con uno
    # viejo, seguiría sirviendo la versión anterior de la aplicación y no
    # habría forma de actualizar a nadie.
    location = /sw.js {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        expires off;
    }

    # El index tampoco: es lo que apunta a los ficheros con hash nuevos.
    location = /index.html {
        add_header Cache-Control "no-cache";
        expires off;
    }

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;
}
