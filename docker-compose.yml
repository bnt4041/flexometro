name: obras

services:
  db:
    # pgvector en vez de postgres:16-alpine — misma versión mayor (16), así
    # que el directorio de datos vale tal cual.
    #
    # OJO al cambiarla: alpine usa musl y ésta glibc, y el orden de colación
    # NO es el mismo. Los índices sobre texto quedan ordenados según la
    # colación con la que se crearon, así que hay que hacer
    # `REINDEX DATABASE` después del cambio o una búsqueda por rango puede
    # devolver de menos sin dar ningún error.
    image: pgvector/pgvector:pg16
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks: [obras]

  keycloak:
    image: quay.io/keycloak/keycloak:26.3
    restart: unless-stopped
    # start-dev usa H2 embebida: vale para desarrollo, no para producción.
    # --import-realm crea el realm al arrancar si no existe, así que el stack
    # sale usable sin configurar nada a mano.
    command: ["start-dev", "--import-realm"]
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: ${KEYCLOAK_ADMIN:-admin}
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD:-admin}
      KC_HTTP_PORT: 8080
      KC_HEALTH_ENABLED: "true"
      # Se sirve bajo /auth del mismo dominio (ver labels de Traefik más abajo);
      # KEYCLOAK_PUBLIC_URL/KEYCLOAK_SERVER_URL en .env deben llevar el mismo sufijo.
      KC_HTTP_RELATIVE_PATH: /auth
      # Sin esto Keycloak no sabe que Traefik termina TLS por delante y firma
      # los tokens con emisor http:// en vez de https:// — la API los rechaza
      # como "emisor no reconocido" porque no coincide con KEYCLOAK_PUBLIC_URL.
      KC_PROXY_HEADERS: xforwarded
    volumes:
      - ./keycloak/realm-obras.json:/opt/keycloak/data/import/realm-obras.json:ro
      # Tema de login con la marca de Flexómetro. start-dev no cachea temas, así
      # que un reinicio del contenedor basta para recoger cambios aquí.
      - ./keycloak/themes/obrai:/opt/keycloak/themes/obrai
    ports:
      - "127.0.0.1:${KEYCLOAK_PORT:-8081}:8080"
    healthcheck:
      # La imagen no trae curl ni wget; se usa el cliente HTTP de la JVM.
      test:
        [
          "CMD-SHELL",
          "exec 3<>/dev/tcp/127.0.0.1/9000 && echo -e 'GET /auth/health/ready HTTP/1.1\\r\\nHost: localhost\\r\\nConnection: close\\r\\n\\r\\n' >&3 && cat <&3 | grep -q 'UP'",
        ]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 40s
    networks: [obras, traefik_proxy]
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=${TRAEFIK_NETWORK:-traefik_proxy}"
      - "traefik.http.routers.obras-keycloak.rule=Host(`${TRAEFIK_DOMAIN:-obras.localhost}`) && PathPrefix(`/auth`)"
      - "traefik.http.routers.obras-keycloak.entrypoints=websecure"
      - "traefik.http.routers.obras-keycloak.tls.certresolver=letsencrypt"
      - "traefik.http.routers.obras-keycloak.service=obras-keycloak"
      - "traefik.http.services.obras-keycloak.loadbalancer.server.port=8080"

  # Almacén de objetos compatible con S3 para el gestor documental (Fase 30).
  # Self-hosted, como el resto del stack — mismo criterio que DeepSeek/Gemini
  # para IA: un proveedor fijo, no una abstracción multi-nube.
  minio:
    image: minio/minio:latest
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-obras}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
    ports:
      - "127.0.0.1:${MINIO_PORT:-9000}:9000"
      - "127.0.0.1:${MINIO_CONSOLE_PORT:-9001}:9001"
    volumes:
      - miniodata:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks: [obras]

  # Servicio de un solo uso: aplica todas las ramas de migración y termina.
  # La API no arranca hasta que este contenedor sale con código 0.
  #
  # Se conecta como el superusuario `obras` porque las migraciones hacen DDL
  # (CREATE SCHEMA, CREATE TABLE...) y, en la primera ejecución, crean también
  # el rol de mínimo privilegio con el que se conecta la API en tiempo de
  # ejecución. Ese rol nunca ve credenciales de superusuario.
  migrate:
    build:
      context: ./backend
    command: alembic upgrade heads
    environment: &db_common
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_HOST: db
      POSTGRES_PORT: 5432
      APP_ENV: ${APP_ENV:-development}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      AUTH_BACKEND: ${AUTH_BACKEND:-keycloak}
      STUB_ORGANIZATION_SLUG: ${STUB_ORGANIZATION_SLUG:-demo}
      # URL interna: la API valida los tokens desde dentro de la red de Docker.
      KEYCLOAK_SERVER_URL: ${KEYCLOAK_SERVER_URL:-http://keycloak:8080}
      # URL pública: la que el navegador usa para redirigir al login. El emisor
      # del token lleva esta, así que ambas tienen que aparecer como válidas.
      KEYCLOAK_PUBLIC_URL: ${KEYCLOAK_PUBLIC_URL:-http://localhost:8081}
      KEYCLOAK_REALM: ${KEYCLOAK_REALM:-obras}
      KEYCLOAK_CLIENT_ID: ${KEYCLOAK_CLIENT_ID:-obras-api}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      # La migración que crea el rol de la API necesita saber a quién conceder
      # los permisos y con qué contraseña dejarlo.
      APP_DB_USER: ${APP_DB_USER:-obras_app}
      APP_DB_PASSWORD: ${APP_DB_PASSWORD}
    volumes:
      - ./backend:/app
    depends_on:
      db:
        condition: service_healthy
    restart: "no"
    networks: [obras]

  api:
    build:
      context: ./backend
    restart: unless-stopped
    environment:
      <<: *db_common
      # Rol de mínimo privilegio: sin SUPERUSER, sin BYPASSRLS. Es lo que hace
      # que las políticas de la migración anterior aíslen de verdad — un
      # superusuario se salta RLS pase lo que pase, sin importar FORCE ROW
      # LEVEL SECURITY.
      POSTGRES_USER: ${APP_DB_USER:-obras_app}
      POSTGRES_PASSWORD: ${APP_DB_PASSWORD}
      # Solo la API llama a DeepSeek/Gemini; las migraciones no hacen DDL con esto.
      DEEPSEEK_API_KEY: ${DEEPSEEK_API_KEY:-}
      DEEPSEEK_MODEL: ${DEEPSEEK_MODEL:-deepseek-chat}
      DEEPSEEK_BASE_URL: ${DEEPSEEK_BASE_URL:-https://api.deepseek.com}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      GEMINI_MODEL: ${GEMINI_MODEL:-gemini-flash-latest}
      GEMINI_BASE_URL: ${GEMINI_BASE_URL:-https://generativelanguage.googleapis.com/v1beta}
      # El panel de superadmin crea usuarios de organización vía el API de
      # administración de Keycloak, con las mismas credenciales de arranque
      # del contenedor de Keycloak.
      KEYCLOAK_ADMIN_USERNAME: ${KEYCLOAK_ADMIN:-admin}
      KEYCLOAK_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD:-admin}
      # Gestor documental (Fase 30): MinIO dentro de la red de Docker.
      MINIO_ENDPOINT_URL: http://minio:9000
      MINIO_ACCESS_KEY: ${MINIO_ROOT_USER:-obras}
      MINIO_SECRET_KEY: ${MINIO_ROOT_PASSWORD}
      MINIO_BUCKET: ${MINIO_BUCKET:-documentos}
      # URL pública para enlaces en correos (bienvenida...); sin esto cae al
      # default http://localhost:5173 aunque .env la tenga puesta.
      FRONTEND_URL: ${FRONTEND_URL:-http://localhost:5173}
    ports:
      - "127.0.0.1:${API_PORT:-8000}:8000"
    volumes:
      # Bind mount para que --reload vea los cambios sin reconstruir la imagen.
      - ./backend:/app
    depends_on:
      db:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
      keycloak:
        condition: service_healthy
      minio:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8000/health"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=${TRAEFIK_NETWORK:-traefik_proxy}"
      - "traefik.http.routers.obras-api.rule=Host(`${TRAEFIK_DOMAIN:-obras.localhost}`) && PathPrefix(`/api`)"
      - "traefik.http.routers.obras-api.entrypoints=websecure"
      - "traefik.http.routers.obras-api.tls.certresolver=letsencrypt"
      - "traefik.http.services.obras-api.loadbalancer.server.port=8000"
    networks: [obras, traefik_proxy]

  web:
    build:
      context: ./frontend
      # `desarrollo` por defecto (recarga en caliente). Para producción:
      #   FRONTEND_TARGET=produccion docker compose up -d --build web
      # Eso compila el bundle y lo sirve con nginx: arranque rápido, sin
      # código fuente expuesto, y con el service worker activo — que es lo
      # que hace la aplicación instalable en el móvil.
      target: ${FRONTEND_TARGET:-desarrollo}
      args:
        VITE_KEYCLOAK_URL: ${KEYCLOAK_PUBLIC_URL:-http://localhost:8081}
        VITE_KEYCLOAK_REALM: ${KEYCLOAK_REALM:-obras}
        VITE_KEYCLOAK_CLIENT_ID: ${KEYCLOAK_WEB_CLIENT_ID:-obras-web}
        VITE_AUTH_BACKEND: ${AUTH_BACKEND:-keycloak}
        VITE_APP_VERSION: ${APP_VERSION:-0.0}
    restart: unless-stopped
    environment:
      # El navegador habla con Keycloak directamente, así que necesita la URL
      # pública, no la de la red interna de Docker.
      VITE_KEYCLOAK_URL: ${KEYCLOAK_PUBLIC_URL:-http://localhost:8081}
      VITE_KEYCLOAK_REALM: ${KEYCLOAK_REALM:-obras}
      VITE_KEYCLOAK_CLIENT_ID: ${KEYCLOAK_WEB_CLIENT_ID:-obras-web}
      VITE_AUTH_BACKEND: ${AUTH_BACKEND:-keycloak}
      VITE_APP_VERSION: ${APP_VERSION:-0.0}
    ports:
      - "127.0.0.1:${WEB_PORT:-5173}:${FRONTEND_PUERTO:-5173}"
    volumes:
      # Para la recarga en caliente en desarrollo. En producción es inerte:
      # nginx sirve desde /usr/share/nginx/html, no desde /app.
      - ./frontend:/app
      # Volumen anónimo: evita que el bind mount tape el node_modules
      # instalado dentro de la imagen.
      - /app/node_modules
    depends_on:
      api:
        condition: service_started
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=${TRAEFIK_NETWORK:-traefik_proxy}"
      - "traefik.http.routers.obras-web.rule=Host(`${TRAEFIK_DOMAIN:-obras.localhost}`)"
      - "traefik.http.routers.obras-web.entrypoints=websecure"
      - "traefik.http.routers.obras-web.tls.certresolver=letsencrypt"
      # 5173 con el servidor de desarrollo, 80 con nginx en producción.
      - "traefik.http.services.obras-web.loadbalancer.server.port=${FRONTEND_PUERTO:-5173}"
    networks: [obras, traefik_proxy]

  # Perfil "proxy": en desarrollo se accede por los puertos publicados, pero el
  # enrutado de producción ya está descrito y se puede probar en local con
  #   docker compose --profile proxy up
  traefik:
    image: traefik:v3.3
    profiles: [proxy]
    command:
      - "--providers.docker=true"
      - "--providers.docker.exposedbydefault=false"
      - "--entrypoints.web.address=:80"
      - "--api.dashboard=true"
    ports:
      - "80:80"
      - "8080:8080"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    networks: [obras]

  # Puente de WhatsApp (GOWA). Se conecta a WhatsApp como si fuera un
  # WhatsApp Web más, vinculando un móvil por QR.
  #
  # NO se publica en Traefik a propósito: quien llegue a esta interfaz puede
  # mandar mensajes como el número vinculado y leer sus conversaciones. Se
  # queda en localhost del servidor, y para vincular el móvil se abre un túnel
  # SSH y se escanea el QR desde el navegador de tu equipo:
  #
  #     ssh -L 3000:127.0.0.1:3000 usuario@servidor
  #     # y abrir http://127.0.0.1:3000 en el navegador
  #
  # `perfil` opcional: sin `--profile whatsapp` el stack sube igual, porque
  # esto es una pieza que no todas las instalaciones quieren.
  gowa:
    image: aldinokemal2104/go-whatsapp-web-multidevice:latest
    profiles: [whatsapp]
    restart: unless-stopped
    command: rest
    environment:
      APP_PORT: 3000
      # Sin esto, cualquiera que alcance el puerto manda mensajes. La API lo
      # usa como usuario/contraseña en Ajustes → WhatsApp.
      # OBLIGATORIO ponerlo en .env antes de levantar este perfil: sin valor,
      # GOWA arranca SIN autenticación y cualquiera que alcance el puerto
      # manda mensajes como el número vinculado.
      #
      # No lleva `:?` (que abortaría si falta) porque Compose interpola todos
      # los servicios aunque su perfil esté apagado: una guarda aquí impediría
      # arrancar el stack entero a quien no use WhatsApp.
      APP_BASIC_AUTH: ${GOWA_BASIC_AUTH:-}
    volumes:
      # La sesión vinculada vive aquí: sin volumen, cada reinicio obligaría a
      # volver a escanear el QR.
      - gowadata:/app/storages
    ports:
      - "127.0.0.1:${GOWA_PORT:-3000}:3000"
    networks: [obras]

  # Web de PIRUETA (la empresa que desarrolla Flexómetro), servida bajo
  # /pirueta del mismo dominio. Es estática: un nginx sobre la carpeta, sin
  # el server.js de Node que se usa para verla en local.
  #
  # Vive fuera del repositorio a propósito (/var/www/pirueta): es un sitio
  # independiente que se edita por su cuenta, y montarlo de solo lectura
  # evita duplicarlo aquí y que las dos copias se separen.
  #
  # Dos middlewares, y los dos hacen falta:
  #   - `pirueta-barra` añade la barra final. Sin ella, /pirueta resuelve las
  #     rutas relativas del index.html (favicon.svg, logo.png, el vídeo)
  #     contra la raíz del dominio y la página sale sin imágenes.
  #   - `pirueta-prefijo` quita /pirueta antes de llegar a nginx, que sirve
  #     desde su propia raíz.
  # El `$$` es escapado de Compose: Traefik recibe un `$` normal.
  pirueta:
    image: nginx:alpine
    restart: unless-stopped
    volumes:
      - /var/www/pirueta:/usr/share/nginx/html:ro
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=${TRAEFIK_NETWORK:-traefik_proxy}"
      - "traefik.http.routers.obras-pirueta.rule=Host(`${TRAEFIK_DOMAIN:-obras.localhost}`) && PathPrefix(`/pirueta`)"
      - "traefik.http.routers.obras-pirueta.entrypoints=websecure"
      - "traefik.http.routers.obras-pirueta.tls.certresolver=letsencrypt"
      - "traefik.http.routers.obras-pirueta.middlewares=pirueta-barra,pirueta-prefijo"
      - "traefik.http.middlewares.pirueta-barra.redirectregex.regex=^https?://([^/]+)/pirueta$$"
      - "traefik.http.middlewares.pirueta-barra.redirectregex.replacement=https://$${1}/pirueta/"
      - "traefik.http.middlewares.pirueta-prefijo.stripprefix.prefixes=/pirueta"
      - "traefik.http.services.obras-pirueta.loadbalancer.server.port=80"
    networks: [traefik_proxy]

volumes:
  pgdata:
  miniodata:
  gowadata:

networks:
  obras:
    driver: bridge
  traefik_proxy:
    external: true
    name: ${TRAEFIK_NETWORK:-traefik_proxy}
