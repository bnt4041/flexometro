# Tema de login de Flexómetro (identificador interno "obrai", heredado del
# nombre anterior de la plataforma — no se ha renombrado la carpeta ni el
# fichero de estilos por ser puramente técnicos, invisibles para el
# usuario). Hereda de keycloak.v2 (el tema por defecto de
# Keycloak 26, PatternFly v5) y solo añade una hoja de estilos propia encima
# — nada de tocar plantillas .ftl, para no tener que perseguir cambios de
# Keycloak en cada actualización. `styles` reemplaza la propiedad heredada,
# así que hay que repetir la hoja del padre (se resuelve igual, buscando
# hacia arriba en la cadena) y añadir la nuestra a continuación.
parent=keycloak.v2

styles=css/styles.css css/obrai.css
